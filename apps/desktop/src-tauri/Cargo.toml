[package]
name = "cortex-core-desktop"
version = "0.3.0"
description = "Cortex Core Desktop Foundation"
authors = ["Cortex Core contributors"]
edition = "2024"
default-run = "cortex-core"
rust-version = "1.99"
license = "MIT"

[lib]
name = "cortex_core_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cortex-core"
path = "src/main.rs"

[[bin]]
name = "monitoring-diagnostic"
path = "src/monitoring-diagnostic.rs"
required-features = ["monitoring-diagnostics"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
wmi = "=0.18.4"
# Already present through Tauri/Wry; used only by opt-in debug lifecycle tracing.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DXCore", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Development status/controller only. All five live adapters are absent; no sensor probing.
# The diagnostic binary rejects release compilation. The ordinary host stays Update-10.
monitoring-diagnostics = []

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
