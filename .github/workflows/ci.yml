name: Validate foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/desktop/generate-fixtures.mjs --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('playwright-report/**', 'test-results/**', 'apps/web/dist/budget-report.json', '.artifacts/motion/*.json') != '' }}
        with:
          name: validation-reports
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            apps/web/dist/budget-report.json
            .artifacts/motion/*.json
            .artifacts/motion/*.png
          retention-days: 14
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: node tools/desktop/generate-fixtures.mjs --check
      - run: node tools/desktop/run.mjs rust-fmt
      - run: pnpm desktop:check
      - run: pnpm desktop:test
      - id: desktop-build
        run: pnpm desktop:build
      - name: Install unsigned development package for smoke validation
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'apps/desktop/src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP 'CortexCore-Development'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDirectory" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'NSIS installation failed' }
          $env:CORTEX_DESKTOP_EXE = Join-Path $installDirectory 'Cortex Core.exe'
          pnpm test:desktop
          if ($LASTEXITCODE -ne 0) { throw 'Native smoke validation failed' }
      - uses: actions/upload-artifact@v7
        if: ${{ always() && steps.desktop-build.outcome == 'success' }}
        with:
          name: cortex-core-windows-x64-unsigned-development
          include-hidden-files: true
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            .artifacts/desktop/*.json
            .artifacts/desktop/*.png
          retention-days: 14
